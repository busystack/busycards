name: busycards
description: BusyCards independent Linux contacts application.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  busystack_contacts:
    path: ../busystack_contacts
  busystack_graph:
    path: ../busystack_graph
  busystack_dav:
    path: ../busystack_dav
  crypto: 3.0.7
  file_selector: 1.1.0
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 17.5.0
  googleapis_auth: 2.3.3
  http: 1.6.0
  intl: 0.20.3
  jose: 0.3.5+2
  logging: 1.3.0
  path: 1.9.1
  path_provider: 2.1.6
  sqlite3: 3.6.0
  system_theme: 3.3.0
  ubuntu_localizations: 0.5.2+4
  url_launcher: 6.3.2
  uuid: 4.5.2
  yaru: 10.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.4
dependency_overrides:
  yaru_window:
    path: third_party/yaru_window
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/busycards-logo.svg
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
