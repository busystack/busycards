name: BusyCards current source and source-bundle validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_bundle_url:
        description: HTTPS URL of the owner-approved four-target source bundle
        required: false
      source_bundle_sha256:
        description: SHA-256 from the local artifact manifest
        required: false
permissions:
  contents: read
jobs:
  current-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize pinned sibling packages
        run: python3 tool/checkout_shared_dependencies.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libhandy-1-dev libsecret-1-dev xvfb dbus-x11 gnome-keyring python3 bubblewrap
      - name: Verify current source and its exact siblings
        run: python3 tool/verify.py
      - name: Build deterministic source and Linux artifacts
        run: python3 tool/package.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: busycards-current-source-${{ github.sha }}
          path: |
            validation/commands/
            validation/artifacts/
            validation/*-contract.json

  verify:
    if: ${{ inputs.source_bundle_url != '' && inputs.source_bundle_sha256 != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch and verify the four-target source layout
        env:
          SOURCE_URL: ${{ inputs.source_bundle_url }}
          SOURCE_SHA256: ${{ inputs.source_bundle_sha256 }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, os, pathlib, re, tarfile, urllib.request
          url=os.environ['SOURCE_URL']; expected=os.environ['SOURCE_SHA256']
          if not url.startswith('https://') or not re.fullmatch('[a-f0-9]{64}',expected): raise ValueError('HTTPS URL and SHA-256 required')
          data=urllib.request.urlopen(url,timeout=60).read(32*1024*1024)
          if hashlib.sha256(data).hexdigest()!=expected: raise ValueError('Source checksum mismatch')
          archive=pathlib.Path('source.tar.gz'); archive.write_bytes(data)
          with tarfile.open(archive) as tar:
            allowed={'busycards','busystack_dav','busystack_graph','busystack_contacts'}
            if any(pathlib.PurePosixPath(m.name).parts[0] not in allowed for m in tar.getmembers()): raise ValueError('Unexpected target')
            tar.extractall('.',filter='data')
          PYCODE
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libhandy-1-dev libsecret-1-dev xvfb dbus-x11 gnome-keyring python3 bubblewrap
      - name: Verify the four authorized targets
        working-directory: busycards
        run: python3 tool/verify.py
      - name: Source and Linux artifacts
        working-directory: busycards
        run: python3 tool/package.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: busycards-validation
          path: |
            busycards/validation/commands/
            busycards/validation/artifacts/
            busycards/validation/*-contract.json
